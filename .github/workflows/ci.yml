name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка, тесты и проверки качества
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Установить JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # §11: команды живут в Makefile, CI — тонкая обёртка, чтобы перенос в GitLab CI был механическим.
      # make verify: тесты, покрытие (JaCoCo), Spotless, Checkstyle, синхронность docs/openapi.yaml
      - name: make verify
        run: make verify

      - name: Отчёты тестов и покрытия
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: ignore

  security:
    name: Проверка зависимостей
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Установить JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Собрать зависимости для сканирования
        run: make deps

      # §4, NFR-3: контроль уязвимостей зависимостей. Trivy выбран вместо OWASP dependency-check,
      # потому что не требует ключа NVD и не ходит в закрытые для контура сервисы (см. docs/DECISIONS.md).
      - name: Trivy — уязвимости в зависимостях
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  docker:
    name: Сборка Docker-образа
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cus:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
