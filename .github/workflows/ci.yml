name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка, тесты и проверки качества
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # statuses: write нужен последнему шагу — он вывешивает имена упавших тестов в статус коммита.
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4

      - name: Установить JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # §11: команды живут в Makefile, CI — тонкая обёртка, чтобы перенос в GitLab CI был механическим.
      # make verify: тесты, покрытие (JaCoCo), Spotless, Checkstyle, синхронность docs/openapi.yaml
      #
      # Версия Docker API спрашивается у движка раннера: жёстко закреплённое число ломает сборку и на
      # старом движке (не знает новой версии), и на новом (не принимает слишком старую).
      # Продукт ставится на чистую операционную систему и не требует Docker (ADR-0078), поэтому и
      # проверка идёт на PostgreSQL, установленной в системе, а не в контейнере. На раннере она
      # предустановлена, её достаточно запустить и завести базу под тесты.
      - name: Поднять PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE USER inconsensu WITH PASSWORD 'inconsensu' SUPERUSER;"
          sudo -u postgres psql -c "CREATE DATABASE inconsensu_test OWNER inconsensu;"

      # Шаги разделены намеренно: логи сборки доступны не всем, а имя упавшего шага видно всегда —
      # по нему сразу понятно, что сломалось: формат, юнит-тесты, интеграционные или покрытие.
      - name: Форматирование и стиль
        run: make lint

      - name: Юнит-тесты
        run: ./mvnw -B -ntp test

      - name: Интеграционные тесты, покрытие и синхронность спецификации
        env:
          INCONSENSU_TEST_DB_URL: jdbc:postgresql://localhost:5432/inconsensu_test
          INCONSENSU_TEST_DB_USER: inconsensu
          INCONSENSU_TEST_DB_PASSWORD: inconsensu
        run: make verify

      - name: Список упавших тестов
        if: failure()
        run: |
          for report in target/surefire-reports/*.txt target/failsafe-reports/*.txt; do
            [ -f "$report" ] || continue
            grep -l "FAILURE\|ERROR" "$report" >/dev/null 2>&1 && { echo "=== $report"; cat "$report"; }
          done

      # Логи сборки доступны не всем: чтобы имя упавшего теста можно было узнать и без доступа к логам,
      # оно вывешивается статусом коммита — его видно в API и на странице коммита.
      - name: Вывесить упавшие тесты в статус коммита
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FAILED=$(python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET

          names = []
          for report in glob.glob("target/**/TEST-*.xml", recursive=True):
              root = ET.parse(report).getroot()
              for case in root.iter("testcase"):
                  if list(case.iter("failure")) or list(case.iter("error")):
                      names.append(case.get("classname", "").split(".")[-1] + "." + case.get("name", ""))
          print("; ".join(names[:4]) if names else "тесты не запускались: упал другой шаг")
          PY
          )
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=failure -f context="упавшие тесты" -f description="${FAILED:0:130}" || true

      - name: Отчёты тестов и покрытия
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: ignore

  security:
    name: Проверка зависимостей
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Установить JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Собрать зависимости для сканирования
        run: make deps

      # §4, NFR-3: контроль уязвимостей зависимостей. Trivy выбран вместо OWASP dependency-check,
      # потому что не требует ключа NVD и не ходит в закрытые для контура сервисы (см. docs/DECISIONS.md).
      #
      # Версия не ниже v0.33: более ранние релизы ссылаются на aquasecurity/setup-trivy по тегу
      # (v0.2.x), а эти теги удалены из репозитория — job падает на Set up job, не начав работу.
      - name: Trivy — уязвимости в зависимостях
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
