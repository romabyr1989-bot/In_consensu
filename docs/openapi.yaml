components:
  schemas:
    AuditEventResponse:
      type: object
      properties:
        actorId:
          type: string
        actorType:
          type: string
        aggregateId:
          type: string
        aggregateType:
          type: string
        eventType:
          type: string
        eventTypeRu:
          type: string
        hash:
          type: string
        id:
          type: integer
          format: int64
        occurredAt:
          type: string
          format: date-time
        payload:
          $ref: "#/components/schemas/JsonNode"
        prevHash:
          type: string
        subjectId:
          type: string
          format: uuid
    Basis:
      type: object
      properties:
        consentId:
          type: string
          format: uuid
        typeCode:
          type: string
        validUntil:
          type: string
          format: date-time
    BulkCheckRequest:
      type: object
      properties:
        channel:
          type: string
          enum:
          - PHONE_CALL
          - SMS
          - EMAIL
          - PUSH
          - MESSENGER
          - POSTAL_MAIL
        identifiers:
          type: array
          items:
            type: string
        includeReasons:
          type: boolean
      required:
      - channel
      - identifiers
    BulkCheckResponse:
      type: object
      properties:
        allowed:
          type: array
          items:
            type: string
        allowedCount:
          type: integer
          format: int32
        channel:
          type: string
        deniedReasons:
          type: object
          additionalProperties:
            type: string
        requested:
          type: integer
          format: int32
        unknownIdentifiers:
          type: array
          items:
            type: string
    BulkJobResponse:
      type: object
      properties:
        allowedCount:
          type: integer
          format: int32
        channel:
          type: string
        error:
          type: string
        jobId:
          type: string
          format: uuid
        processed:
          type: integer
          format: int32
        requested:
          type: integer
          format: int32
        result:
          type: string
        status:
          type: string
        statusRu:
          type: string
    CatalogStats:
      type: object
      properties:
        activeConsents:
          type: integer
          format: int64
        awaitingApproval:
          type: integer
          format: int64
        byThirdParty:
          type: array
          items:
            $ref: "#/components/schemas/ThirdPartyStats"
        byType:
          type: array
          items:
            $ref: "#/components/schemas/TypeStats"
        expiringConsents:
          type: integer
          format: int64
        expiringContracts:
          type: integer
          format: int64
        publishedForms:
          type: integer
          format: int64
        revokedConsents:
          type: integer
          format: int64
    ChannelView:
      type: object
      properties:
        allowed:
          type: boolean
        basis:
          $ref: "#/components/schemas/Basis"
        channel:
          type: string
        channelRu:
          type: string
        reason:
          type: string
        reasonRu:
          type: string
    ConsentEvidenceResponse:
      type: object
      properties:
        consentId:
          type: string
          format: uuid
        events:
          type: array
          items:
