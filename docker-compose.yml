name: inconsensu

services:
  postgres:
    image: postgres:16-alpine
    container_name: inconsensu-postgres
    environment:
      POSTGRES_DB: inconsensu
      POSTGRES_USER: inconsensu
      POSTGRES_PASSWORD: ${INCONSENSU_DB_PASSWORD:-inconsensu}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${INCONSENSU_DB_PORT:-5432}:5432"
    volumes:
      - inconsensu-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inconsensu -d inconsensu"]
      interval: 5s
      timeout: 3s
      retries: 20

  # §4: local SMTP sink; the web UI on 8025 shows the notification e-mails of §7.9.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: inconsensu-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${INCONSENSU_SMTP_PORT:-1025}:1025"
      - "${INCONSENSU_MAILPIT_UI_PORT:-8025}:8025"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inconsensu-app
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${INCONSENSU_PROFILES:-demo}
      INCONSENSU_DB_URL: jdbc:postgresql://postgres:5432/inconsensu
      INCONSENSU_DB_USER: inconsensu
      INCONSENSU_DB_PASSWORD: ${INCONSENSU_DB_PASSWORD:-inconsensu}
      INCONSENSU_TIMEZONE: ${INCONSENSU_TIMEZONE:-Europe/Moscow}
      INCONSENSU_SMTP_HOST: mailpit
      INCONSENSU_SMTP_PORT: 1025
      # Адрес, по которому получатель письма откроет карточку клиента (FR-9.2).
      INCONSENSU_BASE_URL: ${INCONSENSU_BASE_URL:-http://localhost:8080}
    ports:
      - "${INCONSENSU_PORT:-8080}:8080"

volumes:
  inconsensu-pgdata:
