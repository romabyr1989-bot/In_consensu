# Readable logs and detailed health output while running the test suite.
logging:
  structured:
    format:
      console: ""
  level:
    org.testcontainers: WARN
    com.github.dockerjava: WARN
    tc: WARN

spring:
  datasource:
    hikari:
      # Каждый тестовый контекст с иными свойствами Spring поднимает отдельно, а с ним — отдельный пул.
      # С пулом по умолчанию (10) прогон упирался в max_connections PostgreSQL: контекстов уже полдюжины,
      # и падал не тот тест, который виноват, а тот, кому не хватило соединения.
      maximum-pool-size: 4
      minimum-idle: 1

management:
  endpoint:
    health:
      show-details: always

inconsensu:
  jobs:
    # Фоновая доставка не должна опережать сценарий теста: события отправляются явным вызовом.
    outbox:
      initial-delay: PT1H
      delay: PT1H
    notification-dispatch:
      initial-delay: PT1H
      delay: PT1H
  notifications:
    mail:
      # Тест с Mailpit включает отправку сам; остальным письма не нужны.
      enabled: false
  metrics:
    # Пересчёт бизнес-метрик в тестах не нужен: он только шумит запросами в общую базу.
    refresh: PT1H
