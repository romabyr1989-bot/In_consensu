spring:
  application:
    name: inconsensu
  data:
    web:
      pageable:
        # §9: страница не больше 200 записей. Умолчание Spring Data — 2000, и запрос с size=2000
        # выгружал бы разом слишком много ПДн.
        max-page-size: 200
  datasource:
    url: ${INCONSENSU_DB_URL:jdbc:postgresql://localhost:5432/inconsensu}
    username: ${INCONSENSU_DB_USER:inconsensu}
    # NFR-3: secrets come from the environment; the fallback exists only for a local dev database.
    password: ${INCONSENSU_DB_PASSWORD:inconsensu}
    hikari:
      maximum-pool-size: ${INCONSENSU_DB_POOL_SIZE:10}
      pool-name: inconsensu-pool
  jpa:
    open-in-view: false
    hibernate:
      # §4, §14.5: the schema is owned by Flyway, Hibernate only validates it.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.query.fail_on_pagination_over_collection_fetch: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    placeholders:
      # FR-10.2: имя роли, под которой приложение ходит в БД. Если задано и отличается от роли миграций,
      # у неё отзываются права UPDATE и DELETE на журналы. Пусто — журналы защищены только триггером.
      appRole: ${INCONSENSU_DB_APP_ROLE:}
  servlet:
    multipart:
      # FR-4.5: лимит размера файла импорта настраивается
      max-file-size: ${INCONSENSU_IMPORT_MAX_FILE_SIZE:64MB}
      max-request-size: ${INCONSENSU_IMPORT_MAX_FILE_SIZE:64MB}
  jackson:
    # No global null exclusion on purpose: the card contract of Приложение A carries explicit
    # "validUntil": null ("бессрочно"), so nulls are hidden per DTO with @JsonInclude, never globally.
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
  mail:
    # FR-9.2: почтовый транспорт. Без указанного хоста JavaMailSender не создаётся, и уведомления
    # остаются в очереди со статусом «не отправлено» — приложение при этом стартует и работает.
    host: ${INCONSENSU_SMTP_HOST:localhost}
    port: ${INCONSENSU_SMTP_PORT:1025}
    username: ${INCONSENSU_SMTP_USER:}
    password: ${INCONSENSU_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${INCONSENSU_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${INCONSENSU_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  thymeleaf:
    cache: true
  threads:
    virtual:
      enabled: false

server:
  port: ${INCONSENSU_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    db:
      enabled: true
    mail:
      # Недоступный SMTP не делает сервис нерабочим: согласия регистрируются и проверяются без почты,
      # а уведомления ждут в очереди. Иначе оркестратор перезапускал бы исправные экземпляры.
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
  observations:
    key-values:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
  # Deterministic serialisation: docs/openapi.yaml must not churn between builds (§11).
  writer-with-order-by-keys: true

logging:
  # NFR-6: JSON logs with request id and user id.
  structured:
    format:
      console: logstash
  level:
    root: INFO
    ru.example.inconsensu: INFO

inconsensu:
  # §6, §8.7: business dates and calendar arithmetic use the operator timezone.
  timezone: ${INCONSENSU_TIMEZONE:Europe/Moscow}
  selfservice:
    # UI-18: кто вправе встроить страницу самообслуживания во фрейм. По умолчанию только сам сервис;
    # адрес личного кабинета оператор добавляет сюда явно.
    frame-ancestors: ${INCONSENSU_SELFSERVICE_FRAME_ANCESTORS:'self'}
  notifications:
    # Абсолютный адрес установки: из него собираются ссылки в письмах (FR-9.2).
    base-url: ${INCONSENSU_BASE_URL:http://localhost:8080}
    batch-size: ${INCONSENSU_OUTBOX_BATCH_SIZE:50}
    mail:
      from: ${INCONSENSU_MAIL_FROM:noreply@example.ru}
      enabled: ${INCONSENSU_MAIL_ENABLED:true}
    webhook:
      connect-timeout: ${INCONSENSU_WEBHOOK_CONNECT_TIMEOUT:PT5S}
      read-timeout: ${INCONSENSU_WEBHOOK_READ_TIMEOUT:PT10S}
      signature-header: X-InConsensu-Signature
      # NFR-4: список разрешённых хостов подписок. Пусто — без ограничений (только для разработки);
      # запись вида «.example.ru» разрешает поддомены.
      allowed-hosts: ${INCONSENSU_WEBHOOK_ALLOWED_HOSTS:}
      require-https: ${INCONSENSU_WEBHOOK_REQUIRE_HTTPS:false}
  metrics:
    # NFR-6: бизнес-счётчики снимаются по расписанию, а не на каждый скрейп Prometheus.
    refresh: ${INCONSENSU_METRICS_REFRESH:PT1M}
  jobs:
    notification:
      # FR-9.1: ежедневный отбор согласий на переподписание.
      cron: ${INCONSENSU_NOTIFICATION_CRON:0 0 6 * * *}
    notification-dispatch:
      delay: ${INCONSENSU_NOTIFICATION_DISPATCH_DELAY:PT1M}
      initial-delay: ${INCONSENSU_NOTIFICATION_DISPATCH_INITIAL_DELAY:PT1M}
    outbox:
      delay: ${INCONSENSU_OUTBOX_DELAY:PT30S}
      initial-delay: ${INCONSENSU_OUTBOX_INITIAL_DELAY:PT30S}
