<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{ui/fragments/layout :: head('Аудит')}"></head>
<body>
<nav th:replace="~{ui/fragments/layout :: topbar}"></nav>
<div class="ic-layout">
    <aside th:replace="~{ui/fragments/layout :: sidebar('audit')}"></aside>
    <main class="ic-content">
        <h1 class="h4 mb-3">Аудит</h1>
        <ul class="nav nav-tabs mb-3">
            <li class="nav-item"><a class="nav-link active" th:href="@{/ui/audit}">События</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/ui/audit/access-log}">Доступ к ПДн</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/ui/audit/integrity}">Целостность</a></li>
        </ul>

        <!-- UI-15: фильтры по типу агрегата, событию, актору, периоду и ID клиента; состояние — в URL. -->
        <details class="mb-3" th:open="${selectedAggregateType != null or selectedEventType != null
                or selectedActorId != null or selectedSubjectId != null
                or selectedFrom != null or selectedTo != null}">
            <summary class="mb-2">Фильтры</summary>
            <form class="row g-2" th:action="@{/ui/audit}" method="get">
                <!-- UI-0.8: выбранная сортировка переживает применение фильтров. -->
                <input type="hidden" name="sort" th:if="${sort != null}" th:value="${sort}">
                <input type="hidden" name="direction" th:if="${direction != null}" th:value="${direction}">
                <div class="col-md-3">
                    <label class="form-label" for="aggregateType">Тип агрегата</label>
                    <input class="form-control" id="aggregateType" name="aggregateType" placeholder="consent"
                           th:value="${selectedAggregateType}">
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="eventType">Тип события</label>
                    <select class="form-select" id="eventType" name="eventType">
                        <option value="">любой</option>
                        <option th:each="type : ${eventTypes}" th:value="${type}" th:text="${type.nameRu()}"
                                th:selected="${type == selectedEventType}">Согласие получено</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="actorId">Актор</label>
                    <input class="form-control" id="actorId" name="actorId" th:value="${selectedActorId}">
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="subjectId">ID клиента</label>
                    <input class="form-control" id="subjectId" name="subjectId" th:value="${selectedSubjectId}">
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="from">С даты</label>
                    <input class="form-control" type="date" id="from" name="from" th:value="${selectedFrom}">
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="to">По дату</label>
                    <input class="form-control" type="date" id="to" name="to" th:value="${selectedTo}">
                </div>
                <div class="col-12">
                    <button class="btn btn-primary" type="submit">Показать</button>
                    <a class="btn btn-outline-secondary" th:href="@{/ui/audit}">Сбросить фильтры</a>
                </div>
            </form>
        </details>

        <table class="table bg-white align-middle">
            <thead>
            <tr>
                <th th:replace="~{ui/fragments/layout :: sortHeader('Когда', 'occurredAt')}"></th>
                <th th:replace="~{ui/fragments/layout :: sortHeader('Агрегат', 'aggregate')}"></th>
                <th th:replace="~{ui/fragments/layout :: sortHeader('Событие', 'eventType')}"></th>
                <th th:replace="~{ui/fragments/layout :: sortHeader('Актор', 'actor')}"></th>
                <th scope="col">Payload</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="event : ${events.content}">
                <td th:text="${event.occurredAt}">17.08.2026 14:05</td>
                <td>
                    <div th:text="${event.aggregateType}">consent</div>
                    <code class="small" th:text="${event.aggregateId}">…</code>
                </td>
                <td th:text="${event.eventTypeRu}">Согласие отозвано</td>
                <td th:text="${event.actor}">manager</td>
                <td><pre class="small mb-0" style="max-width: 420px; white-space: pre-wrap" th:text="${event.payload}">{}</pre></td>
            </tr>
            <tr th:if="${events.isEmpty()}">
                <td colspan="5" class="text-muted">Ничего не найдено. Ослабьте фильтры или сбросьте их.</td>
            </tr>
            </tbody>
        </table>

        <div th:replace="~{ui/fragments/layout :: pagination(${events})}"></div>
        <div th:replace="~{ui/fragments/layout :: pageSize}"></div>
    </main>
</div>
</body>
</html>
