<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{ui/fragments/layout :: head('Доступ к ПДн')}"></head>
<body>
<nav th:replace="~{ui/fragments/layout :: topbar}"></nav>
<div class="ic-layout">
    <aside th:replace="~{ui/fragments/layout :: sidebar('audit')}"></aside>
    <main class="ic-content">
        <nav th:replace="~{ui/fragments/layout :: breadcrumbs('Аудит', null, 'Доступ к ПДн')}"></nav>
        <h1 class="h4 mb-3">Аудит</h1>
        <ul class="nav nav-tabs mb-3">
            <li class="nav-item"><a class="nav-link" th:href="@{/ui/audit}">События</a></li>
            <li class="nav-item"><a class="nav-link active" th:href="@{/ui/audit/access-log}">Доступ к ПДн</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/ui/audit/integrity}">Целостность</a></li>
        </ul>

        <!-- UI-15: фильтры по экрану, клиенту и периоду; сброс возвращает журнал целиком (UI-0.8). -->
        <details class="mb-3" th:open="${selectedEndpoint != null or selectedSubjectId != null
                or selectedFrom != null or selectedTo != null}">
            <summary class="mb-2">Фильтры</summary>
            <form class="row g-2" th:action="@{/ui/audit/access-log}" method="get">
                <!-- UI-0.8: выбранная сортировка переживает применение фильтров. -->
                <input type="hidden" name="sort" th:if="${sort != null}" th:value="${sort}">
                <input type="hidden" name="direction" th:if="${direction != null}" th:value="${direction}">
                <div class="col-md-4">
                    <label class="form-label" for="endpoint">Экран или эндпоинт</label>
                    <input class="form-control" id="endpoint" name="endpoint" placeholder="/api/v1/subjects"
                           th:value="${selectedEndpoint}">
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="subjectId">Идентификатор клиента</label>
                    <input class="form-control" id="subjectId" name="subjectId" th:value="${selectedSubjectId}">
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="from">С даты</label>
                    <input class="form-control" type="date" id="from" name="from" th:value="${selectedFrom}">
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="to">По дату</label>
                    <input class="form-control" type="date" id="to" name="to" th:value="${selectedTo}">
                </div>
                <div class="col-12">
                    <button class="btn btn-primary" type="submit">Показать</button>
                    <a class="btn btn-outline-secondary" th:href="@{/ui/audit/access-log}">Сбросить фильтры</a>
                </div>
            </form>
        </details>

        <table class="table bg-white align-middle">
            <thead>
            <tr>
                <th th:replace="~{ui/fragments/layout :: sortHeader('Когда', 'occurredAt')}"></th>
                <th scope="col">Пользователь</th>
                <th th:replace="~{ui/fragments/layout :: sortHeader('Экран или эндпоинт', 'endpoint')}"></th>
                <th scope="col">Клиент</th>
                <th scope="col">Request id</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="entry : ${entries.content}">
                <td th:text="${entry.occurredAt}">17.08.2026 14:05</td>
                <td th:text="${entry.user}">Иванова А. А.</td>
                <td th:text="${entry.endpoint}">/api/v1/subjects/{id}/card</td>
                <td><code class="small" th:text="${entry.subjectId}"></code></td>
                <td><code class="small" th:text="${entry.requestId}"></code></td>
            </tr>
            <tr th:if="${entries.isEmpty()}">
                <td colspan="5" class="text-muted">Ничего не найдено. Ослабьте фильтры или сбросьте их.</td>
            </tr>
            </tbody>
        </table>

        <div th:replace="~{ui/fragments/layout :: pagination(${entries})}"></div>
        <div th:replace="~{ui/fragments/layout :: pageSize}"></div>
    </main>
</div>
</body>
</html>
