<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{ui/fragments/layout :: head('Целостность журнала')}"></head>
<body>
<nav th:replace="~{ui/fragments/layout :: topbar}"></nav>
<div class="cus-layout">
    <aside th:replace="~{ui/fragments/layout :: sidebar('audit')}"></aside>
    <main class="cus-content">
        <h1 class="h4 mb-3">Аудит</h1>
        <ul class="nav nav-tabs mb-3">
            <li class="nav-item"><a class="nav-link" th:href="@{/ui/audit}">События</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/ui/audit/access-log}">Доступ к ПДн</a></li>
            <li class="nav-item"><a class="nav-link active" th:href="@{/ui/audit/integrity}">Целостность</a></li>
        </ul>

        <form th:action="@{/ui/audit/integrity}" method="post" class="mb-3">
            <button class="btn btn-primary" type="submit">Запустить проверку</button>
            <span class="text-muted small ms-2">Проверка идёт в фоне; обновите страницу через несколько секунд.</span>
        </form>

        <table class="table bg-white align-middle">
            <thead>
            <tr>
                <th scope="col">Запущена</th><th scope="col">Кто</th><th scope="col">Состояние</th>
                <th scope="col">Результат</th><th scope="col">Проверено</th><th scope="col">Нарушения</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="run : ${verifications}">
                <td th:text="${#temporals.format(run.startedAt, 'dd.MM.yyyy HH:mm')}">17.08.2026 10:00</td>
                <td th:text="${run.startedBy}">auditor</td>
                <td th:text="${run.status.nameRu()}">завершена</td>
                <td>
                    <span class="badge bg-success" th:if="${run.integrity == 'OK'}">целостность подтверждена</span>
                    <span class="badge bg-danger" th:if="${run.integrity != null and run.integrity != 'OK'}">нарушения</span>
                    <span class="badge bg-secondary" th:if="${run.integrity == null}">нет данных</span>
                </td>
                <td th:text="${run.eventsChecked} + ' событий, ' + ${run.aggregatesChecked} + ' агрегатов, ' + ${run.anchorsChecked} + ' якорей'">
                    0 событий
                </td>
                <td><pre class="small mb-0" style="max-width: 360px; white-space: pre-wrap" th:text="${run.problems}">[]</pre></td>
            </tr>
            </tbody>
        </table>
        <p class="text-muted" th:if="${verifications.isEmpty()}">Проверок ещё не было.</p>
    </main>
</div>
</body>
</html>
