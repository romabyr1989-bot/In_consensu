<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{ui/fragments/layout :: head('Доставки подписки')}"></head>
<body>
<nav th:replace="~{ui/fragments/layout :: topbar}"></nav>
<div class="ic-layout">
    <aside th:replace="~{ui/fragments/layout :: sidebar('webhooks')}"></aside>
    <main class="ic-content">
        <nav th:replace="~{ui/fragments/layout :: breadcrumbs('Webhooks', '/ui/webhooks', 'Доставки')}"></nav>
        <h1 class="h4 mb-3" th:text="'Доставки: ' + ${subscription.name}">Доставки</h1>
        <table class="table bg-white align-middle">
            <thead>
            <tr><th scope="col">Когда</th><th scope="col">Событие</th><th scope="col">Попытка</th>
                <th scope="col">Код ответа</th><th scope="col">Ошибка</th><th scope="col"></th></tr>
            </thead>
            <tbody>
            <tr th:each="delivery : ${deliveries.content}">
                <td th:text="${delivery.deliveredAt}">17.08.2026 10:00</td>
                <td><code th:text="${delivery.eventId}">…</code></td>
                <td th:text="${delivery.attempt}">1</td>
                <td>
                    <span class="badge" th:classappend="${delivery.successful} ? 'bg-success' : 'bg-danger'"
                          th:text="${delivery.responseCode}" th:aria-label="${delivery.responseCode}">200</span>
                </td>
                <td th:text="${delivery.error}"></td>
                <td class="text-end">
                    <!-- UI-14: неудавшуюся доставку можно повторить прямо отсюда. -->
                    <form th:action="@{/ui/webhooks/{id}/deliveries/{eventId}/retry
                              (id=${subscription.id},eventId=${delivery.eventId})}" method="post"
                          th:unless="${delivery.successful}">
                        <button class="btn btn-sm btn-outline-primary" type="submit">Повторить</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${deliveries.isEmpty()}">
                <td colspan="6" class="text-muted">Доставок не было: подписка ещё не получала событий.</td>
            </tr>
            </tbody>
        </table>

        <div class="d-flex align-items-center gap-2">
            <div th:replace="~{ui/fragments/layout :: pagination(${deliveries})}"></div>
            <div th:replace="~{ui/fragments/layout :: pageSize}"></div>
        </div>
        <a class="btn btn-link" th:href="@{/ui/webhooks}">К списку подписок</a>
    </main>
</div>
</body>
</html>
