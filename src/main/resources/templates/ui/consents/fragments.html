<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<body>

<!-- UI-4: точный текст версии формы, по которой дано согласие, в модальном окне карточки -->
<div th:fragment="consentText">
    <div class="modal-header">
        <h2 class="modal-title h5">Текст согласия</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
    </div>
    <div class="modal-body">
        <dl class="row small mb-3">
            <dt class="col-sm-4">Форма</dt>
            <dd class="col-sm-8" th:text="${dossier.form()?.code}">CONTRACT_MAIN</dd>
            <dt class="col-sm-4">Версия</dt>
            <dd class="col-sm-8" th:text="${dossier.form()?.versionNumber}">3</dd>
            <dt class="col-sm-4">Опубликована</dt>
            <dd class="col-sm-8" th:text="${dossier.form()?.publishedAt}">12.03.2025</dd>
            <dt class="col-sm-4">Контрольная сумма</dt>
            <dd class="col-sm-8">
                <code th:text="${dossier.storedChecksum()}">sha256:…</code>
                <span class="badge bg-success ms-1" th:if="${dossier.checksumMatches()}"
                      aria-label="контрольная сумма совпадает">совпадает</span>
                <span class="badge bg-danger ms-1" th:unless="${dossier.checksumMatches()}"
                      aria-label="контрольная сумма не совпадает">не совпадает</span>
            </dd>
        </dl>
        <pre class="bg-light p-3 small" th:text="${dossier.formText()}">Текст согласия</pre>
    </div>
    <div class="modal-footer">
        <a class="btn btn-outline-secondary btn-sm"
           th:href="@{/ui/consents/{id}(id=${dossier.consent().id})}">Открыть досье</a>
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Закрыть</button>
    </div>
</div>

</body>
</html>
