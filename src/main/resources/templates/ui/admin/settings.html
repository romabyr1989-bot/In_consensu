<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{ui/fragments/layout :: head('Настройки оператора')}"></head>
<body>
<nav th:replace="~{ui/fragments/layout :: topbar}"></nav>
<div class="ic-layout">
    <aside th:replace="~{ui/fragments/layout :: sidebar('settings')}"></aside>
    <main class="ic-content">
        <nav th:replace="~{ui/fragments/layout :: breadcrumbs('Администрирование', null, 'Настройки оператора')}"></nav>
        <h1 class="h4 mb-3">Настройки оператора</h1>
        <div th:replace="~{ui/fragments/layout :: flash}"></div>

        <form th:action="@{/ui/admin/settings}" method="post" data-warn-unsaved="true">
            <div class="card mb-3" th:each="group : ${settingGroups}">
                <div class="card-header" th:text="${group.title}">Реквизиты оператора</div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6" th:each="setting : ${group.settings}">
                            <label class="form-label" th:for="${setting.key}" th:text="${setting.label}">
                                Наименование оператора</label>
                            <!--
                              Настройка, прочитанная при запуске, показывается, но не правится: форма,
                              принимающая значение и молча его не применяющая, хуже отсутствующего поля.
                            -->
                            <input class="form-control" th:id="${setting.key}" th:name="${setting.key}"
                                   th:value="${setting.value}" th:readonly="${setting.readOnly}"
                                   th:disabled="${setting.readOnly}">
                            <div class="form-text" th:if="${!#strings.isEmpty(setting.hint)}"
                                 th:text="${setting.hint}">Период ISO-8601</div>
                            <div class="form-text text-muted"><code th:text="${setting.key}">operator.name</code></div>
                        </div>
                    </div>
                </div>
            </div>
            <button class="btn btn-primary" type="submit">Сохранить настройки</button>
        </form>

        <div class="card mt-4">
            <div class="card-header">История изменений</div>
            <table class="table table-sm mb-0">
                <thead>
                <tr><th scope="col">Когда</th><th scope="col">Кто</th><th scope="col">Что изменено</th></tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(history)}">
                    <td colspan="3" class="text-muted">Настройки ещё не менялись.</td>
                </tr>
                <tr th:each="event : ${history}">
                    <td th:text="${formats.dateTime(event.occurredAt)}">17.08.2026 10:00</td>
                    <td th:text="${event.actorId}">admin</td>
                    <td><pre class="small mb-0" style="white-space: pre-wrap" th:text="${event.payload}">{}</pre></td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<script th:src="@{/assets/js/inconsensu.js}"></script>
</body>
</html>
