<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{ui/fragments/layout :: head('Пользователи')}"></head>
<body>
<nav th:replace="~{ui/fragments/layout :: topbar}"></nav>
<div class="ic-layout">
    <aside th:replace="~{ui/fragments/layout :: sidebar('users')}"></aside>
    <main class="ic-content">
        <nav th:replace="~{ui/fragments/layout :: breadcrumbs('Администрирование', null, 'Пользователи')}"></nav>
        <h1 class="h4 mb-3">Пользователи</h1>
        <div th:replace="~{ui/fragments/layout :: flash}"></div>

        <table class="table bg-white align-middle">
            <thead>
            <tr>
                <th th:replace="~{ui/fragments/layout :: sortHeader('Логин', 'login')}"></th>
                <th th:replace="~{ui/fragments/layout :: sortHeader('ФИО', 'fullName')}"></th>
                <th th:replace="~{ui/fragments/layout :: sortHeader('Email', 'email')}"></th>
                <th scope="col">Роли</th>
                <th th:replace="~{ui/fragments/layout :: sortHeader('Активен', 'active')}"></th>
                <th scope="col">Сброс пароля</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users.content}">
                <td th:text="${user.login}">admin</td>
                <td th:text="${user.fullName}">Администратор</td>
                <td th:text="${user.email}"></td>
                <td>
                    <form th:action="@{/ui/admin/users/{id}(id=${user.id})}" method="post" class="d-flex gap-2">
                        <input type="hidden" name="fullName" th:value="${user.fullName}">
                        <input type="hidden" name="email" th:value="${user.email}">
                        <select class="form-select form-select-sm" name="roles" multiple size="3"
                                th:aria-label="'Роли пользователя ' + ${user.login}">
                            <option th:each="role : ${roles}" th:value="${role}" th:text="${role.nameRu()}"
                                    th:selected="${user.roleCodes.contains(role.name())}">Администратор</option>
                        </select>
                    <div th:replace="~{ui/fragments/layout :: fieldError('email')}"></div>
                    <div th:replace="~{ui/fragments/layout :: fieldError('fullName')}"></div>
                        <div>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" name="active" value="true"
                                       th:checked="${user.active}" th:id="'active-' + ${user.id}">
                                <label class="form-check-label" th:for="'active-' + ${user.id}">активен</label>
                            </div>
                            <button class="btn btn-sm btn-outline-primary mt-1" type="submit">Сохранить</button>
                        </div>
                    </form>
                </td>
                <td>
                    <span class="badge bg-success" th:if="${user.active}">да</span>
                    <span class="badge bg-secondary" th:unless="${user.active}">нет</span>
                </td>
                <td>
                    <form th:action="@{/ui/admin/users/{id}/reset-password(id=${user.id})}" method="post"
                          class="d-flex gap-1">
                        <input class="form-control form-control-sm" type="password" name="password" required
                               th:aria-label="'Новый пароль для ' + ${user.login}">
                        <button class="btn btn-sm btn-outline-secondary" type="submit">Сбросить</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${users.isEmpty()}">
                <td colspan="6" class="text-muted">Пользователей нет. Создайте первого формой ниже.</td>
            </tr>
            </tbody>
        </table>

        <div class="d-flex align-items-center gap-2 mb-4">
            <div th:replace="~{ui/fragments/layout :: pagination(${users})}"></div>
            <div th:replace="~{ui/fragments/layout :: pageSize}"></div>
        </div>

        <div class="card">
            <div class="card-header">Новый пользователь</div>
            <div class="card-body">
                <form th:action="@{/ui/admin/users}" method="post" class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label" for="login">Логин <span aria-hidden="true">*</span></label>
                        <input class="form-control" id="login" name="login" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="password">Пароль <span aria-hidden="true">*</span></label>
                        <input class="form-control" type="password" id="password" name="password" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="fullName">ФИО <span aria-hidden="true">*</span></label>
                        <input class="form-control" id="fullName" name="fullName" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-control" type="email" id="email" name="email">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="newRoles">Роли <span aria-hidden="true">*</span></label>
                        <select class="form-select" id="newRoles" name="roles" multiple size="5" required>
                            <option th:each="role : ${roles}" th:value="${role}" th:text="${role.nameRu()}">Менеджер</option>
                        </select>
                    <div th:replace="~{ui/fragments/layout :: fieldError('password')}"></div>
                    <div th:replace="~{ui/fragments/layout :: fieldError('login')}"></div>
                    </div>
                    <div class="col-12">
                        <button class="btn btn-primary" type="submit">Создать</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/assets/js/inconsensu.js}"></script>
</body>
</html>
