<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{ui/fragments/layout :: head('Задача импорта')}"></head>
<body>
<nav th:replace="~{ui/fragments/layout :: topbar}"></nav>
<div class="ic-layout">
    <aside th:replace="~{ui/fragments/layout :: sidebar('import')}"></aside>
    <main class="ic-content">
        <nav th:replace="~{ui/fragments/layout :: breadcrumbs('Импорт', '/ui/import', 'Задача')}"></nav>
        <div th:replace="~{ui/fragments/layout :: flash}"></div>
        <h1 class="h4 mb-3" th:text="'Импорт: ' + ${job.job().fileName}">Импорт</h1>

        <div th:replace="~{ui/import/fragments :: progress}"></div>

        <div class="card mt-3" th:if="${!job.report().isEmpty()}">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>Ошибки по строкам</span>
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/ui/import/{id}/report.csv(id=${job.job().id})}">
                    Скачать отчёт CSV</a>
            </div>
            <table class="table table-sm mb-0">
                <thead>
                <tr><th scope="col">Строка</th><th scope="col">Поле</th><th scope="col">Причина</th></tr>
                </thead>
                <tbody>
                <tr th:each="row : ${job.report()}">
                    <td th:text="${row['line']}">3</td>
                    <td th:text="${row['field']}">phone</td>
                    <td th:text="${row['message']}">неверный формат</td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- UI-12: после успешного пробного запуска боевой идёт кнопкой по тому же файлу, с подтверждением. -->
        <form class="mt-3" th:action="@{/ui/import/{id}/run(id=${job.job().id})}" method="post"
              th:if="${job.job().dryRun and job.job().status.name() == 'COMPLETED' and job.job().rejected == 0}"
              th:data-confirm="'Файл ' + ${job.job().fileName} + ' будет импортирован в боевом режиме: '
                  + ${job.job().total} + ' строк(и) попадут в реестр согласий. Продолжить?'">
            <p class="text-muted">Пробный запуск прошёл без ошибок — тот же файл можно импортировать по-настоящему.</p>
            <button class="btn btn-primary" type="submit">Запустить импорт</button>
        </form>
        <p class="text-muted mt-3"
           th:if="${job.job().dryRun and job.job().status.name() == 'COMPLETED' and job.job().rejected > 0}">
            Пробный запуск нашёл ошибки: исправьте файл и загрузите его снова.
        </p>
    </main>
</div>
<script th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
<script th:src="@{/assets/js/inconsensu.js}"></script>
</body>
</html>
