<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{ui/fragments/layout :: head('Импорт согласий')}"></head>
<body>
<nav th:replace="~{ui/fragments/layout :: topbar}"></nav>
<div class="ic-layout">
    <aside th:replace="~{ui/fragments/layout :: sidebar('import')}"></aside>
    <main class="ic-content">
        <nav th:replace="~{ui/fragments/layout :: breadcrumbs('Импорт', null, 'Задачи импорта')}"></nav>
        <h1 class="h4 mb-3">Импорт согласий</h1>
        <div th:replace="~{ui/fragments/layout :: flash}"></div>

        <div class="card mb-4">
            <div class="card-header">Загрузка файла</div>
            <div class="card-body">
                <form th:action="@{/ui/import}" method="post" enctype="multipart/form-data" class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="file">Файл CSV или JSON <span aria-hidden="true">*</span></label>
                        <input class="form-control" type="file" id="file" name="file" accept=".csv,.json" required>
                        <div class="form-text">
                            <a th:href="@{/ui/import/format}">Описание формата</a> ·
                            <a th:href="@{/assets/sample-import.csv}" download>Скачать пример файла</a>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="source">Источник</label>
                        <select class="form-select" id="source" name="source">
                            <option th:each="value : ${sources}" th:value="${value}" th:text="${value.nameRu()}"
                                    th:selected="${value.name() == 'CLIENT_BASE_IMPORT'}">Импорт базы клиентов</option>
                        </select>
                    </div>
                    <div class="col-md-3 align-self-end">
                        <div class="form-check form-switch mb-2">
                            <!--
                              Снятый чекбокс браузер не присылает, поэтому рядом идёт скрытый маркер: без него
                              переключатель нельзя было выключить и боевой импорт из интерфейса был недостижим.
                            -->
                            <input type="hidden" name="dryRunSubmitted" value="true">
                            <input class="form-check-input" type="checkbox" role="switch" id="dryRun" name="dryRun"
                                   value="true" checked>
                            <label class="form-check-label" for="dryRun">Пробный запуск (dry-run)</label>
                        </div>
                        <button class="btn btn-primary" type="submit">Загрузить</button>
                    </div>
                </form>
            </div>
        </div>

        <table class="table bg-white align-middle">
            <thead>
            <tr>
                <th th:replace="~{ui/fragments/layout :: sortHeader('Файл', 'fileName')}"></th>
                <th th:replace="~{ui/fragments/layout :: sortHeader('Запущен', 'startedAt')}"></th>
                <th th:replace="~{ui/fragments/layout :: sortHeader('Кто', 'startedBy')}"></th>
                <th scope="col">Режим</th>
                <th th:replace="~{ui/fragments/layout :: sortHeader('Статус', 'status')}"></th>
                <th th:replace="~{ui/fragments/layout :: sortHeader('Всего / импортировано / отклонено', 'total')}"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="job : ${jobs.content}">
                <td><a th:href="@{/ui/import/{id}(id=${job.id})}" th:text="${job.fileName}">clients.csv</a></td>
                <td th:text="${formats.dateTime(job.startedAt)}">17.08.2026 10:00</td>
                <td th:text="${job.startedBy}">dpo</td>
                <td th:text="${job.dryRun} ? 'пробный' : 'боевой'">пробный</td>
                <td th:text="${job.status.nameRu()}">завершено</td>
                <td th:text="${job.total} + ' / ' + ${job.imported} + ' / ' + ${job.rejected}">10 / 9 / 1</td>
            </tr>
            <tr th:if="${jobs.isEmpty()}">
                <td colspan="6" class="text-muted">Импорт ещё не запускался. Загрузите файл формой выше.</td>
            </tr>
            </tbody>
        </table>

        <div class="d-flex align-items-center gap-2">
            <div th:replace="~{ui/fragments/layout :: pagination(${jobs})}"></div>
            <div th:replace="~{ui/fragments/layout :: pageSize}"></div>
        </div>
    </main>
</div>
</body>
</html>
