<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{ui/fragments/layout :: head('Импорт согласий')}"></head>
<body>
<nav th:replace="~{ui/fragments/layout :: topbar}"></nav>
<div class="cus-layout">
    <aside th:replace="~{ui/fragments/layout :: sidebar('import')}"></aside>
    <main class="cus-content">
        <h1 class="h4 mb-3">Импорт согласий</h1>
        <div th:replace="~{ui/fragments/layout :: flash}"></div>

        <div class="card mb-4">
            <div class="card-header">Загрузка файла</div>
            <div class="card-body">
                <form th:action="@{/ui/import}" method="post" enctype="multipart/form-data" class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="file">Файл CSV или JSON <span aria-hidden="true">*</span></label>
                        <input class="form-control" type="file" id="file" name="file" accept=".csv,.json" required>
                        <div class="form-text">
                            Формат описан в <a href="https://github.com" th:href="@{/swagger-ui.html}">документации</a>
                            и в файле docs/import-format.md.
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="source">Источник</label>
                        <input class="form-control" id="source" name="source" value="LEGACY_DB">
                    </div>
                    <div class="col-md-3 align-self-end">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="dryRun" name="dryRun" value="true" checked>
                            <label class="form-check-label" for="dryRun">Пробный запуск (dry-run)</label>
                        </div>
                        <button class="btn btn-primary" type="submit">Загрузить</button>
                    </div>
                </form>
            </div>
        </div>

        <table class="table bg-white align-middle">
            <thead>
            <tr>
                <th scope="col">Файл</th><th scope="col">Запущен</th><th scope="col">Кто</th>
                <th scope="col">Режим</th><th scope="col">Статус</th><th scope="col">Всего / импортировано / отклонено</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="job : ${jobs}">
                <td><a th:href="@{/ui/import/{id}(id=${job.id})}" th:text="${job.fileName}">clients.csv</a></td>
                <td th:text="${#temporals.format(job.startedAt, 'dd.MM.yyyy HH:mm')}">17.08.2026 10:00</td>
                <td th:text="${job.startedBy}">dpo</td>
                <td th:text="${job.dryRun} ? 'пробный' : 'боевой'">пробный</td>
                <td th:text="${job.status.nameRu()}">завершено</td>
                <td th:text="${job.total} + ' / ' + ${job.imported} + ' / ' + ${job.rejected}">10 / 9 / 1</td>
            </tr>
            </tbody>
        </table>
        <p class="text-muted" th:if="${jobs.isEmpty()}">Импорт ещё не запускался.</p>
    </main>
</div>
</body>
</html>
