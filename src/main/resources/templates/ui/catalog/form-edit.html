<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{ui/fragments/layout :: head('Конструктор формы')}"></head>
<body>
<nav th:replace="~{ui/fragments/layout :: topbar}"></nav>
<div class="ic-layout">
    <aside th:replace="~{ui/fragments/layout :: sidebar('forms')}"></aside>
    <main class="ic-content">
        <nav th:replace="~{ui/fragments/layout :: breadcrumbs('Формы согласий', '/ui/catalog/forms', 'Конструктор')}"></nav>
        <h1 class="h4 mb-3">
            Конструктор формы
            <small class="text-muted" th:text="${form.form().code} + ' · версия ' + ${form.form().versionNumber}">CODE · версия 1</small>
        </h1>
        <div th:replace="~{ui/fragments/layout :: flash}"></div>

        <div class="row g-3">
            <div class="col-12 col-xl-7">
                <form th:action="@{/ui/catalog/forms/{id}/edit(id=${form.form().id})}" method="post"
                      data-warn-unsaved="true" id="form-editor">
                    <div class="card mb-3">
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label" for="title">Название <span aria-hidden="true">*</span></label>
                                <input class="form-control" id="title" name="title" th:value="${form.form().title}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="sourceChannels">Источники применения</label>
                                <select class="form-select" id="sourceChannels" name="sourceChannels" multiple size="5">
                                    <option th:each="source : ${sources}" th:value="${source}"
                                            th:text="${source.nameRu()}"
                                            th:selected="${form.form().sourceChannels.contains(source)}">Сайт</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="body">Тело формы</label>
                                <div class="mb-1">
                                    <button type="button" class="btn btn-sm btn-outline-secondary"
                                            th:each="placeholder : ${ {'{{operator.name}}','{{operator.address}}','{{subject.fio}}','{{subject.phone}}','{{subject.email}}','{{third_party.name}}','{{third_party.address}}'} }"
                                            th:text="${placeholder}" data-insert-into="body"
                                            th:data-insert="${placeholder}">
                                        {{operator.name}}
                                    </button>
                                </div>
                                <textarea class="form-control" id="body" name="body" rows="10"
                                          th:text="${form.form().body}"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="processingActions">Перечень действий и способов обработки</label>
                                <textarea class="form-control" id="processingActions" name="processingActions" rows="2"
                                          th:text="${form.form().processingActions}"></textarea>
                            </div>
                            <div class="mb-0">
                                <label class="form-label" for="revocationProcedure">Срок действия и порядок отзыва</label>
                                <textarea class="form-control" id="revocationProcedure" name="revocationProcedure" rows="2"
                                          th:text="${form.form().revocationProcedure}"></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="card mb-3">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <span>Пункты формы</span>
                            <button class="btn btn-sm btn-outline-primary" type="button" onclick="cusAddItem()">Добавить пункт</button>
                        </div>
                        <div class="card-body" id="items">
                            <!-- th:block, а не обёртка: у th:replace приоритет выше th:each, а лишний узел
                                 сломал бы перестановку пунктов — она двигает соседей внутри #items. -->
                            <th:block th:each="item, iter : ${form.form().items}">
                                <div th:replace="~{ui/catalog/fragments :: itemFields(${iter.index}, ${item})}"></div>
                            </th:block>
                        </div>
                        <!-- Заготовка нового пункта: тот же фрагмент, поэтому поля не разойдутся. -->
                        <template id="item-template">
                            <div th:replace="~{ui/catalog/fragments :: itemFields('__INDEX__', null)}"></div>
                        </template>
                    </div>

                    <div class="d-flex gap-2">
                        <button class="btn btn-primary" type="submit">Сохранить черновик</button>
                        <!-- UI-8: проверка идёт по сохранённому черновику, поэтому это названо явно. -->
                        <button class="btn btn-outline-secondary" type="button" hx-indicator="this"
                                th:hx-get="@{/ui/catalog/forms/{id}/preview(id=${form.form().id})}"
                                hx-target="#form-preview" hx-swap="outerHTML">Проверить сохранённое</button>
                    </div>
                </form>

                <form class="d-inline" th:action="@{/ui/catalog/forms/{id}/submit(id=${form.form().id})}" method="post">
                    <button class="btn btn-success mt-2" type="submit"
                            th:disabled="${!form.validation().valid()}">Отправить на согласование</button>
                </form>
                <form class="d-inline" th:action="@{/ui/catalog/forms/{id}/delete(id=${form.form().id})}" method="post"
                      data-confirm="Черновик будет удалён без возможности восстановления. Продолжить?">
                    <button class="btn btn-outline-danger mt-2" type="submit">Удалить черновик</button>
                </form>
            </div>

            <div class="col-12 col-xl-5">
                <div th:replace="~{ui/catalog/fragments :: preview}"></div>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/assets/js/inconsensu.js}"></script>
<!-- Без th:inline: шаблонных подстановок здесь нет, а «[[» в регулярном выражении Thymeleaf
     принимает за своё выражение и падает на разборе. -->
<script>
    // UI-8: работа со списком пунктов без сборщика и фреймворков (UI-0.2).
    //
    // Порядок в разметке — это и есть порядок пунктов: applyDraft нумерует их индексом цикла, поэтому
    // перестановке достаточно поменять узлы местами и переписать индексы в именах полей.
    function cusItems() {
        return Array.prototype.slice.call(document.querySelectorAll('#items .ic-item'));
    }

    function cusRenumber() {
        cusItems().forEach(function (item, index) {
            item.querySelectorAll('[name]').forEach(function (field) {
                field.name = field.name.replace(/items\[[0-9_A-Z]*\]/, 'items[' + index + ']');
            });
            var number = item.querySelector('.ic-item-number');
            if (number) {
                number.textContent = index + 1;
            }
        });
    }

    function cusAddItem() {
        // Из шаблона, а не копией первого пункта: у свежего черновика пунктов нет, и копировать нечего —
        // раньше кнопка на такой форме молча ничего не делала.
        var template = document.getElementById('item-template');
        var container = document.getElementById('items');
        container.appendChild(template.content.cloneNode(true));
        cusRenumber();
        cusBindItems();
    }

    function cusMoveItem(button, delta) {
        var item = button.closest('.ic-item');
        var items = cusItems();
        var index = items.indexOf(item);
        var target = index + delta;
        if (target < 0 || target >= items.length) {
            return;
        }
        if (delta < 0) {
            item.parentNode.insertBefore(item, items[target]);
        } else {
            item.parentNode.insertBefore(items[target], item);
        }
        cusRenumber();
    }

    function cusRemoveItem(button) {
        button.closest('.ic-item').remove();
        cusRenumber();
    }

    // UI-8: третье лицо показывается, только если тип его требует; для рекламного типа рядом с
    // переключателем «обязателен» появляется предупреждение FR-1.4.
    function cusSyncItem(item) {
        var select = item.querySelector('.ic-item-type');
        if (!select) {
            return;
        }
        var option = select.options[select.selectedIndex];
        var requiresThirdParty = option && option.dataset.requiresThirdParty === 'true';
        var advertising = option && option.dataset.advertising === 'true';
        var thirdParty = item.querySelector('.ic-third-party');
        if (thirdParty) {
            thirdParty.classList.toggle('d-none', !requiresThirdParty);
            if (!requiresThirdParty) {
                var field = thirdParty.querySelector('select');
                if (field) {
                    field.value = '';
                }
            }
        }
        var mandatory = item.querySelector('.ic-item-mandatory');
        var warning = item.querySelector('.ic-advertising-warning');
        if (warning) {
            warning.classList.toggle('d-none', !(advertising && mandatory && mandatory.checked));
        }
    }

    function cusBindItems() {
        cusItems().forEach(function (item) {
            if (item.dataset.bound === 'true') {
                cusSyncItem(item);
                return;
            }
            item.dataset.bound = 'true';
            var select = item.querySelector('.ic-item-type');
            var mandatory = item.querySelector('.ic-item-mandatory');
            if (select) {
                select.addEventListener('change', function () {
                    cusSyncItem(item);
                });
            }
            if (mandatory) {
                mandatory.addEventListener('change', function () {
                    cusSyncItem(item);
                });
            }
            cusSyncItem(item);
        });
    }

    document.addEventListener('DOMContentLoaded', cusBindItems);
</script>
</body>
</html>
