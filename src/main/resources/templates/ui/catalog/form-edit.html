<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{ui/fragments/layout :: head('Конструктор формы')}"></head>
<body>
<nav th:replace="~{ui/fragments/layout :: topbar}"></nav>
<div class="ic-layout">
    <aside th:replace="~{ui/fragments/layout :: sidebar('forms')}"></aside>
    <main class="ic-content">
        <h1 class="h4 mb-3">
            Конструктор формы
            <small class="text-muted" th:text="${form.form().code} + ' · версия ' + ${form.form().versionNumber}">CODE · версия 1</small>
        </h1>
        <div th:replace="~{ui/fragments/layout :: flash}"></div>

        <div class="row g-3">
            <div class="col-12 col-xl-7">
                <form th:action="@{/ui/catalog/forms/{id}/edit(id=${form.form().id})}" method="post"
                      data-warn-unsaved="true" id="form-editor">
                    <div class="card mb-3">
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label" for="title">Название <span aria-hidden="true">*</span></label>
                                <input class="form-control" id="title" name="title" th:value="${form.form().title}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="sourceChannels">Источники применения</label>
                                <select class="form-select" id="sourceChannels" name="sourceChannels" multiple size="5">
                                    <option th:each="source : ${sources}" th:value="${source}"
                                            th:text="${source.nameRu()}"
                                            th:selected="${form.form().sourceChannels.contains(source)}">Сайт</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="body">Тело формы</label>
                                <div class="mb-1">
                                    <button type="button" class="btn btn-sm btn-outline-secondary"
                                            th:each="placeholder : ${ {'{{operator.name}}','{{operator.address}}','{{subject.fio}}','{{subject.phone}}','{{subject.email}}','{{third_party.name}}','{{third_party.address}}'} }"
                                            th:text="${placeholder}" data-insert-into="body"
                                            th:data-insert="${placeholder}">
                                        {{operator.name}}
                                    </button>
                                </div>
                                <textarea class="form-control" id="body" name="body" rows="10"
                                          th:text="${form.form().body}"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="processingActions">Перечень действий и способов обработки</label>
                                <textarea class="form-control" id="processingActions" name="processingActions" rows="2"
                                          th:text="${form.form().processingActions}"></textarea>
                            </div>
                            <div class="mb-0">
                                <label class="form-label" for="revocationProcedure">Срок действия и порядок отзыва</label>
                                <textarea class="form-control" id="revocationProcedure" name="revocationProcedure" rows="2"
                                          th:text="${form.form().revocationProcedure}"></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="card mb-3">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <span>Пункты формы</span>
                            <button class="btn btn-sm btn-outline-primary" type="button" onclick="cusAddItem()">Добавить пункт</button>
                        </div>
                        <div class="card-body" id="items">
                            <fieldset class="border rounded p-3 mb-3 ic-item"
                                      th:each="item, iter : ${form.form().items}">
                                <legend class="h6">Пункт <span th:text="${iter.index + 1}">1</span></legend>
                                <div class="row g-2">
                                    <div class="col-md-6">
                                        <label class="form-label">Тип согласия</label>
                                        <select class="form-select" th:name="'items[' + ${iter.index} + '].typeCode'">
                                            <option th:each="type : ${activeTypes}" th:value="${type.code}"
                                                    th:text="${type.nameRu}"
                                                    th:selected="${item.consentType.code == type.code}">Тип</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Срок (ISO-8601, пусто — до отзыва)</label>
                                        <input class="form-control" th:name="'items[' + ${iter.index} + '].validity'"
                                               th:value="${item.validity}">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">Формулировка</label>
                                        <textarea class="form-control" rows="2"
                                                  th:name="'items[' + ${iter.index} + '].text'"
                                                  th:text="${item.text}"></textarea>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Цели (по одной в строке)</label>
                                        <textarea class="form-control" rows="2"
                                                  th:name="'items[' + ${iter.index} + '].purposes'"
                                                  th:text="${#strings.listJoin(item.purposes, '&#10;')}"></textarea>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Категории ПДн</label>
                                        <select class="form-select" multiple size="4"
                                                th:name="'items[' + ${iter.index} + '].categories'">
                                            <option th:each="category : ${pdnCategories}" th:value="${category.code}"
                                                    th:text="${category.nameRu} + (${category.special} ? ' (специальная)' : '')"
                                                    th:selected="${item.pdnCategories.contains(category.code)}">ФИО</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Третье лицо</label>
                                        <select class="form-select" th:name="'items[' + ${iter.index} + '].thirdPartyId'">
                                            <option value="">—</option>
                                            <option th:each="party : ${thirdParties}" th:value="${party.id}"
                                                    th:text="${party.name}"
                                                    th:selected="${item.thirdPartyId != null and item.thirdPartyId == party.id}">ООО</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 align-self-end">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" value="true"
                                                   th:name="'items[' + ${iter.index} + '].mandatory'"
                                                   th:checked="${item.mandatory}">
                                            <label class="form-check-label">Обязателен для заключения договора</label>
                                        </div>
                                    </div>
                                </div>
                            </fieldset>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button class="btn btn-primary" type="submit">Сохранить черновик</button>
                    </div>
                </form>

                <form class="d-inline" th:action="@{/ui/catalog/forms/{id}/submit(id=${form.form().id})}" method="post">
                    <button class="btn btn-success mt-2" type="submit"
                            th:disabled="${!form.validation().valid()}">Отправить на согласование</button>
                </form>
                <form class="d-inline" th:action="@{/ui/catalog/forms/{id}/delete(id=${form.form().id})}" method="post"
                      data-confirm="Черновик будет удалён без возможности восстановления. Продолжить?">
                    <button class="btn btn-outline-danger mt-2" type="submit">Удалить черновик</button>
                </form>
            </div>

            <div class="col-12 col-xl-5">
                <div th:replace="~{ui/catalog/fragments :: preview}"></div>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/assets/js/inconsensu.js}"></script>
<script th:inline="javascript">
    // Новый пункт добавляется копией разметки: без сборщика и без шаблонизатора на клиенте (UI-0.2).
    function cusAddItem() {
        var container = document.getElementById('items');
        var index = container.querySelectorAll('.ic-item').length;
        var first = container.querySelector('.ic-item');
        if (!first) {
            return;
        }
        var clone = first.cloneNode(true);
        clone.querySelectorAll('[name]').forEach(function (field) {
            field.name = field.name.replace(/items\[\d+\]/, 'items[' + index + ']');
            if (field.type === 'checkbox') {
                field.checked = false;
            } else if (field.tagName === 'SELECT') {
                field.selectedIndex = 0;
            } else {
                field.value = '';
            }
        });
        clone.querySelector('legend span').textContent = index + 1;
        container.appendChild(clone);
    }
</script>
</body>
</html>
