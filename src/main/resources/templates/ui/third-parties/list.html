<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ru">
<head th:replace="~{ui/fragments/layout :: head('Третьи лица')}"></head>
<body>
<nav th:replace="~{ui/fragments/layout :: topbar}"></nav>
<div class="ic-layout">
    <aside th:replace="~{ui/fragments/layout :: sidebar('third-parties')}"></aside>
    <main class="ic-content">
        <h1 class="h4 mb-3">Третьи лица</h1>
        <div th:replace="~{ui/fragments/layout :: flash}"></div>

        <div class="table-responsive mb-4">
            <table class="table bg-white align-middle">
                <thead>
                <tr>
                    <th th:replace="~{ui/fragments/layout :: sortHeader('Наименование', 'name')}"></th>
                    <th th:replace="~{ui/fragments/layout :: sortHeader('ИНН', 'inn')}"></th>
                    <th th:replace="~{ui/fragments/layout :: sortHeader('Роль', 'role')}"></th>
                    <th th:replace="~{ui/fragments/layout :: sortHeader('Договор', 'contract')}"></th>
                    <th scope="col">Категории ПДн</th>
                    <th th:replace="~{ui/fragments/layout :: sortHeader('Согласий: действует / истекает / отозвано', 'consents')}"></th>
                    <th scope="col">Активно</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="party : ${thirdParties.content}">
                    <td><a th:href="@{/ui/third-parties/{id}(id=${party.id})}" th:text="${party.name}">ООО «Моменто»</a></td>
                    <td th:text="${party.inn}">7701234567</td>
                    <td th:text="${party.roleRu}">Обработчик</td>
                    <td>
                        <span th:text="${party.contractNumber}">ДП-2024/17</span>
                        <span class="text-muted small" th:if="${!#strings.isEmpty(party.contractUntil)}"
                              th:text="'до ' + ${party.contractUntil}">до 31.12.2026</span>
                        <span class="badge" th:if="${!#strings.isEmpty(party.contractBadge)}"
                              th:classappend="${party.contractBadgeKind}" th:text="${party.contractBadge}">истекает</span>
                    </td>
                    <td th:text="${party.categoriesRu}">ФИО, номер телефона</td>
                    <td>
                        <span class="badge bg-success" th:text="${party.consentsActive}" title="Действующие">10</span>
                        <span class="badge bg-warning text-dark" th:text="${party.consentsExpiring}"
                              title="Истекают в ближайшие 30 дней">1</span>
                        <span class="badge bg-danger" th:text="${party.consentsRevoked}" title="Отозванные">2</span>
                    </td>
                    <td>
                        <span class="badge bg-success" th:if="${party.active}">активно</span>
                        <span class="badge bg-secondary" th:unless="${party.active}">выключено</span>
                    </td>
                </tr>
                <tr th:if="${thirdParties.isEmpty()}">
                    <td colspan="7" class="text-muted">Третьих лиц ещё нет. Добавьте партнёра формой ниже.</td>
                </tr>
                </tbody>
            </table>

        <div class="d-flex align-items-center gap-2 mb-3">
            <div th:replace="~{ui/fragments/layout :: pagination(${thirdParties})}"></div>
            <div th:replace="~{ui/fragments/layout :: pageSize}"></div>
        </div>
        </div>

        <div class="card" sec:authorize="hasAnyRole('LAWYER','DPO','ADMIN')">
            <div class="card-header">Добавить третье лицо</div>
            <div class="card-body">
                <form th:action="@{/ui/third-parties}" method="post" class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label" for="inn">ИНН <span aria-hidden="true">*</span></label>
                        <input class="form-control" id="inn" name="inn" required>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label" for="name">Наименование <span aria-hidden="true">*</span></label>
                        <input class="form-control" id="name" name="name" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="role">Роль <span aria-hidden="true">*</span></label>
                        <select class="form-select" id="role" name="role" required>
                            <option th:each="role : ${roles}" th:value="${role}" th:text="${role.nameRu()}">Обработчик</option>
                        </select>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label" for="address">Адрес <span aria-hidden="true">*</span></label>
                        <input class="form-control" id="address" name="address" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="contractNumber">Договор</label>
                        <input class="form-control" id="contractNumber" name="contractNumber">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="contractDate">Дата договора</label>
                        <input class="form-control" type="date" id="contractDate" name="contractDate">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="contractValidUntil">Действует до</label>
                        <input class="form-control" type="date" id="contractValidUntil" name="contractValidUntil">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="allowedPdnCategories">Разрешённые категории ПДн</label>
                        <select class="form-select" id="allowedPdnCategories" name="allowedPdnCategories" multiple size="4">
                            <option th:each="category : ${categories}" th:value="${category.code}"
                                    th:text="${category.nameRu}">ФИО</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <button class="btn btn-primary" type="submit">Добавить</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/assets/js/inconsensu.js}"></script>
</body>
</html>
