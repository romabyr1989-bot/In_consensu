<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Проверка отправки писем</title>
</head>
<body style="margin:0;padding:24px;background:#f5f6f8;font-family:Arial,Helvetica,sans-serif;color:#1f2328;">
<div style="max-width:640px;margin:0 auto;background:#ffffff;border-radius:8px;padding:24px;">
    <h2 style="margin:0 0 16px;font-size:18px;">Проверка отправки писем</h2>
    <p style="margin:0 0 16px;">
        Это тестовое письмо Центра управления согласиями. Если вы его видите, почтовые настройки верны.
    </p>
    <p style="margin:0;color:#6b7280;font-size:14px;">
        Отправлено: <span th:text="${sentAt}">18.08.2026 19:40</span>,
        инициатор: <span th:text="${actor}">admin</span>.
    </p>
    <hr style="border:none;border-top:1px solid #e5e7eb;margin:24px 0 12px;">
    <p style="font-size:12px;color:#6b7280;margin:0;">
        Письмо отправлено автоматически системой In consensu. Отвечать на него не нужно.
    </p>
</div>
</body>
</html>
