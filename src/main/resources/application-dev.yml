# Local development: human readable logs and verbose health details.
logging:
  structured:
    format:
      console: ""
  level:
    ru.example.inconsensu: DEBUG
    org.flywaydb: DEBUG

management:
  endpoint:
    health:
      show-details: always

spring:
  jpa:
    properties:
      hibernate.format_sql: true

server:
  servlet:
    session:
      cookie:
        # Локальный запуск идёт по HTTP: с флагом Secure браузер не вернул бы куку сессии.
        secure: false
